# Overlay for a single-host production-like stack (~1000 users).
# Usage:
#   export JWT_SECRET='at-least-32-characters-long-secret'
#   export INTERNAL_API_KEY='...'
#   export WEBHOOK_SECRET='...'
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
services:
  api:
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      SEED_DEMO: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://volunteers.mahak.ir}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://volunteers.mahak.ir}
      DB_MAX_CONNS: "40"
      DB_MIN_CONNS: "4"
      JWT_TTL_HOURS: "12"

  postgres:
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB", "-c", "work_mem=8MB"]
