name: mahak-volunteers

services:
  postgres:
    image: postgres:16-alpine
    container_name: mahak-volunteer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mahak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mahak}
      POSTGRES_DB: mahak_volunteers
      TZ: Asia/Tehran
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahak -d mahak_volunteers"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: &default-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: mahak-volunteer-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  minio:
    image: minio/minio:latest
    container_name: mahak-volunteer-minio
    restart: unless-stopped
    profiles: ["object-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mahak
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mahakminio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    logging: *default-logging

  api:
    build: ./backend
    image: mahak-volunteer-api:local
    container_name: mahak-volunteer-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://mahak:${POSTGRES_PASSWORD:-mahak}@postgres:5432/mahak_volunteers?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      STORAGE_DIR: /data/uploads
      REDIS_URL: redis://redis:6379
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-mahak-internal-demo-token}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEED_DEMO: ${SEED_DEMO:-true}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-40}
      TZ: Asia/Tehran
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    logging: *default-logging

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8080
    image: mahak-volunteer-portal:local
    container_name: mahak-volunteer-portal
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      HOSTNAME: 0.0.0.0
      TZ: Asia/Tehran
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  minio:
  uploads:
