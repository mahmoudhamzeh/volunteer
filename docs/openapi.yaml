        "400": { $ref: "#/components/responses/Error" }
  /api/v1/tickets/{id}/messages:
    post:
      summary: Reply to ticket
      tags: [Tickets]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
