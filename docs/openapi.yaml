  /api/v1/tickets/{id}:
    get:
      summary: Ticket thread
      tags: [Tickets]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
