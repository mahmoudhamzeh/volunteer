openapi: 3.0.3
info:
  title: Mahak Volunteer Management Platform API
  description: |
    وب‌سرویس REST سامانه مدیریت داوطلبان محک (`mahak-volunteer-api`).

    این مشخصات برای پیاده‌سازی کلاینت توسط تیم دیگر است. منبع مسیرها با
    `GET /api/v1/` و `backend/internal/adapter/http/catalog.go` هم‌تراز است.

    **نقش‌ها**
    - `volunteer` داوطلب
    - `operator` بهره‌بردار / واحد پشتیبانی — همان دسترسی `/admin/*`
    - `admin` ادمین سامانه — همان دسترسی `/admin/*`

    **احراز**
    - JWT: `Authorization: Bearer <token>`
    - یکپارچگی داخلی: `X-Internal-Token: <INTERNAL_API_TOKEN>`
    - وب‌هوک ماموریت: توکن ماموریت در بدنه (`token`) یا هدر `X-Mission-Token`؛ با توکن داخلی قاطی نشود

    خطاها همیشه `{"error":"<پیام فارسی یا انگلیسی>"}` هستند.
  version: "1.1.0"
  contact:
    name: Mahak Volunteer Platform
servers:
  - url: http://localhost:8080
    description: Local
  - url: https://{host}
    description: Deployed
    variables:
      host:
        default: volunteers.example.ir
tags:
  - name: Health
  - name: Auth
  - name: Session
  - name: Tickets
  - name: Volunteer
  - name: Tasks
  - name: Missions
  - name: Certificates
  - name: StaffVolunteers
  - name: StaffTasks
  - name: StaffAssignments
  - name: StaffMissions
  - name: StaffTickets
  - name: StaffCertificates
  - name: StaffReports
  - name: StaffSkills
  - name: StaffTrainings
  - name: Integrations
security: []
paths:
  /healthz:
    get:
      summary: Liveness
      tags: [Health]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/Health'
        "400": { $ref: "#/components/responses/Error" }
  /readyz:
    get:
      summary: Readiness
      tags: [Health]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/Health'
        "503": { description: Database unavailable }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/:
    get:
      summary: Full route catalog
      tags: [Health]
      responses:
        "200": { description: Catalog JSON }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/auth/otp/send:
    post:
      summary: Send OTP
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPSendRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/OTPSendResult'
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/auth/otp/verify:
    post:
      summary: Verify OTP
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/AuthResult'
        "201": { description: New user }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      summary: Login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/AuthResult'
        "401": { description: Unauthorized }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/auth/register:
    post:
      summary: Register volunteer (role ignored)
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/AuthResult'
        "409": { description: Email exists }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/auth/external:
    post:
      summary: Map Mahak Auth user
      tags: [Auth]
      security: [{ InternalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAuthRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/AuthResult'
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/me:
    get:
      summary: Current session
      tags: [Session]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/MeResponse'
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/notifications:
    get:
