      tags: [Volunteer]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/AvailabilityList'
        "400": { $ref: "#/components/responses/Error" }
    put:
