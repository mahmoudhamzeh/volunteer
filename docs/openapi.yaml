      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/Assignment'
        "409": { description: Already assigned }
        "422": { description: Not eligible or full }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/assignments/me:
    get:
      summary: My assignments
      tags: [Tasks]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/AssignmentList'
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/volunteers/me/trainings:
    get:
      summary: My completed training courses
      tags: [Tasks]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VolunteerTraining'
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/assignments/{id}/start:
    post:
      summary: Start remote work
      tags: [Tasks]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/Assignment'
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/assignments/{id}/deliver:
    post:
      summary: Deliver remote work
      tags: [Tasks]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeliveryUpload'
      responses:
        "200":
          description: OK
          content:
            application/json:
