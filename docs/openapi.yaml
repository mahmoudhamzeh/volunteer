            assignments_by_status:
              type: object
              additionalProperties: { type: integer }
            tasks_by_status:
              type: object
              additionalProperties: { type: integer }
            tasks_by_kind:
              type: object
              additionalProperties: { type: integer }
            hours_this_month: { type: number }
