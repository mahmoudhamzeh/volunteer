                $ref: '$#/components/schemas/Ticket'
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/skills:
    get:
      summary: Public skill catalog
      tags: [Volunteer]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/SkillGroupList'
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/volunteers/me:
    get:
      summary: My profile
      tags: [Volunteer]
