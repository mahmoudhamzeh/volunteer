        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalReview'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/SkillProposal'
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/webhooks/events:
    post:
      summary: Inbound mission award. Send X-Internal-Token plus body.token or X-Mission-Token.
      tags: [Integrations]
      security: [{ InternalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        "202":
          description: OK
          content:
            application/json:
              schema:
                $ref: '$#/components/schemas/StatusOK'
        "400": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: ظرفیت این فعالیت تکمیل است }
    StatusOK:
      type: object
      properties:
        status: { type: string, example: ok }
    Health:
      type: object
      properties:
        status: { type: string }
        service: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        phone: { type: string }
        role: { type: string, enum: [volunteer, admin, operator] }
        external_user_id: { type: string }
        created_at: { type: string, format: date-time }
    AuthResult:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
        is_new: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email: { type: string }
        password: { type: string, minLength: 8 }
        full_name: { type: string }
        role: { type: string, description: "Ignored; always volunteer" }
    OTPSendRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: "09121234567" }
    OTPSendResult:
      type: object
      properties:
        phone: { type: string }
        ttl_seconds: { type: integer }
        resend_after: { type: integer }
        is_new: { type: boolean }
        dev_code: { type: string, description: "Only when OTP_REVEAL=true" }
    OTPVerifyRequest:
      type: object
      required: [phone, code]
      properties:
        phone: { type: string }
        code: { type: string }
        full_name: { type: string }
    ExternalAuthRequest:
      type: object
      required: [external_user_id]
      properties:
        external_user_id: { type: string }
        email: { type: string }
        full_name: { type: string }
        role: { type: string, enum: [volunteer, admin, operator] }
    MeResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        volunteer: { $ref: "#/components/schemas/Volunteer" }
    Volunteer:
      type: object
